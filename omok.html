<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10202b" />
  <title>돌과 바람 · 오목</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310202b'/%3E%3Ccircle cx='22' cy='32' r='12' fill='%23f4efe4'/%3E%3Ccircle cx='42' cy='32' r='12' fill='%23d89b55'/%3E%3C/svg%3E" />
  <style>
    :root { --ink:#10202b; --ink-soft:#193340; --cream:#f5f0e7; --paper:#fffaf1; --gold:#d89b55; --gold-light:#f2c98d; --muted:#71808a; --line:rgba(16,32,43,.12); --shadow:0 22px 60px rgba(16,32,43,.16); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 10% 0%, #f9e9c8 0, transparent 34%), linear-gradient(135deg,#f8f4ec 0%,#efe6d8 100%); font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit; }
    button { border:0; cursor:pointer; }
    .shell { max-width:1220px; margin:0 auto; padding:28px 24px 42px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:13px; }
    .mark { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; background:var(--ink); box-shadow:0 8px 20px rgba(16,32,43,.2); }
    .mark span { width:11px; height:11px; border-radius:50%; background:var(--gold-light); box-shadow:14px 0 0 #fff8ee; }
    h1,h2,p { margin:0; }
    h1 { font-size:20px; letter-spacing:-.04em; }
    .eyebrow { color:var(--gold); font-size:11px; letter-spacing:.18em; font-weight:800; text-transform:uppercase; margin-bottom:2px; }
    .top-actions { display:flex; gap:10px; align-items:center; }
    .ghost { background:rgba(255,255,255,.65); color:var(--ink); border:1px solid var(--line); padding:11px 16px; border-radius:12px; font-weight:700; transition:.2s; }
    .ghost:hover { background:white; transform:translateY(-1px); }
    .layout { display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(310px, .75fr); gap:24px; align-items:start; }
    .board-card,.panel { background:rgba(255,250,241,.82); border:1px solid rgba(255,255,255,.7); box-shadow:var(--shadow); backdrop-filter:blur(12px); border-radius:28px; }
    .board-card { padding:26px; }
    .status-row { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; }
    .turn { display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; }
    .turn-dot { width:14px; height:14px; border-radius:50%; background:#14232c; box-shadow:inset -2px -2px 2px rgba(255,255,255,.16); }
    .turn-dot.white { background:#f8f2e8; border:1px solid #d8cfc1; box-shadow:inset -2px -2px 2px rgba(0,0,0,.08); }
    .helper { color:var(--muted); font-size:13px; text-align:right; }
    .board-wrap { display:grid; place-items:center; padding:18px; border-radius:22px; background:linear-gradient(145deg,#e4b86f,#c18a45); box-shadow:inset 0 1px 0 rgba(255,255,255,.3), inset 0 -8px 16px rgba(83,49,20,.16); }
    .board { width:min(100%, 680px); aspect-ratio:1; position:relative; padding:0; background:#dda968; background-image:linear-gradient(135deg,rgba(255,255,255,.12),transparent 45%); border-radius:9px; touch-action:manipulation; overflow:hidden; }
    .board::before { content:""; position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(to right,rgba(66,40,17,.42) 1px,transparent 1px),linear-gradient(to bottom,rgba(66,40,17,.42) 1px,transparent 1px); background-size:calc(100% / 14) 100%,100% calc(100% / 14); z-index:0; }
    .cell { position:absolute; width:9%; height:9%; transform:translate(-50%,-50%); background:transparent; padding:0; z-index:1; }
    .cell:focus-visible { outline:3px solid #fff; outline-offset:-7px; z-index:4; }
    .stone { position:absolute; width:86%; height:86%; left:50%; top:50%; border-radius:50%; transform:translate(-50%,-50%) scale(0); animation:place .18s ease-out forwards; z-index:2; }
    .stone.black { background:radial-gradient(circle at 33% 27%,#58646a 0,#202d34 30%,#0c171c 72%); box-shadow:2px 4px 5px rgba(31,20,11,.34); }
    .stone.white { background:radial-gradient(circle at 33% 27%,#fff 0,#f0e9dd 42%,#beb7ad 100%); box-shadow:2px 4px 5px rgba(31,20,11,.24); }
    .stone.win { outline:4px solid var(--gold-light); outline-offset:2px; }
    @keyframes place { to { transform:translate(-50%,-50%) scale(1); } }
    .panel { padding:24px; display:flex; flex-direction:column; gap:22px; }
    .panel h2 { font-size:19px; letter-spacing:-.04em; }
    .players { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .player { border:1px solid var(--line); border-radius:17px; padding:14px; background:rgba(255,255,255,.46); transition:.2s; }
    .player.active { border-color:var(--gold); box-shadow:0 0 0 3px rgba(216,155,85,.15); background:#fffaf0; }
    .player-top { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
    .avatar { width:25px; height:25px; border-radius:50%; background:var(--ink); }
    .avatar.white { background:#f8f2e8; border:1px solid #d0c7ba; }
    .player-name { font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .score { font-size:28px; font-weight:900; letter-spacing:-.06em; }
    label { display:block; font-size:12px; font-weight:800; color:var(--muted); margin-bottom:7px; }
    .names { display:grid; gap:12px; }
    input { width:100%; border:1px solid var(--line); background:rgba(255,255,255,.7); color:var(--ink); border-radius:11px; padding:12px 13px; outline:none; }
    input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(216,155,85,.14); }
    .room { padding:15px; background:var(--ink); color:var(--cream); border-radius:17px; }
    .room-line { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px; }
    .room-code { font-size:22px; letter-spacing:.16em; font-weight:900; color:var(--gold-light); }
    .copy { padding:9px 11px; border-radius:9px; color:var(--ink); background:var(--gold-light); font-size:12px; font-weight:900; white-space:nowrap; }
    .room small { color:#b9c5c8; font-size:12px; }
    .primary { padding:14px; border-radius:13px; background:var(--gold); color:#2c1d0f; font-weight:900; transition:.2s; }
    .primary:hover { background:#e8b673; transform:translateY(-1px); }
    .secondary { width:100%; padding:12px; border-radius:12px; background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:800; }
    .secondary:hover { color:var(--ink); background:white; }
    .history { border-top:1px solid var(--line); padding-top:18px; }
    .history-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
    .history h3 { font-size:13px; }
    .history-list { display:flex; flex-wrap:wrap; gap:7px; max-height:85px; overflow:auto; }
    .move { font-size:12px; padding:6px 8px; border-radius:7px; background:rgba(16,32,43,.06); color:var(--muted); }
    .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); opacity:0; pointer-events:none; background:var(--ink); color:white; padding:12px 17px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.2); transition:.25s; font-size:14px; font-weight:700; z-index:20; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:840px) { .shell { padding:20px 14px 30px; } header { margin-bottom:20px; } .layout { grid-template-columns:1fr; } .panel { order:2; } .board-card { padding:15px; } .board-wrap { padding:10px; } .helper { font-size:12px; } }
    @media (max-width:500px) { .top-actions .ghost { padding:9px 11px; font-size:12px; } .status-row { align-items:flex-start; flex-direction:column; } .helper { text-align:left; } .room-code { font-size:19px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><div class="mark"><span></span></div><div><div class="eyebrow">Stone & Wind</div><h1>친구와 두는 오목</h1></div></div>
      <div class="top-actions"><a class="ghost" href="chess.html">체스</a><a class="ghost" href="janggi.html">장기</a><a class="ghost" href="baduk.html">바둑</a><button class="ghost" id="newGameTop">새 게임</button></div>
    </header>
    <section class="layout">
      <section class="board-card" aria-label="오목판">
        <div class="status-row"><div class="turn"><span class="turn-dot" id="turnDot"></span><span id="turnText">검은돌 차례</span></div><div class="helper" id="statusText">가로, 세로, 대각선으로 다섯 개를 먼저 이어 보세요.</div></div>
        <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="15 곱하기 15 오목판"></div></div>
      </section>
      <aside class="panel">
        <div><div class="eyebrow">MATCH ROOM</div><h2>이번 판의 선수</h2></div>
        <div class="players"><div class="player active" id="playerBlack"><div class="player-top"><span class="avatar"></span><span class="player-name" id="blackLabel">검은돌</span></div><div class="score" id="blackScore">0</div></div><div class="player" id="playerWhite"><div class="player-top"><span class="avatar white"></span><span class="player-name" id="whiteLabel">흰돌</span></div><div class="score" id="whiteScore">0</div></div></div>
        <div class="names"><div><label for="blackName">검은돌 닉네임</label><input id="blackName" maxlength="12" value="검은돌" /></div><div><label for="whiteName">흰돌 닉네임</label><input id="whiteName" maxlength="12" value="흰돌" /></div></div>
        <div class="room"><small>친구에게 이 코드를 보여 주세요</small><div class="room-line"><span class="room-code" id="roomCode">OMOK-7K2P</span><button class="copy" id="copyCode">코드 복사</button></div><div style="display:flex;gap:7px;margin-top:11px"><input id="roomInput" maxlength="9" placeholder="친구의 코드 입력" style="min-width:0;background:#ffffff18;border-color:#ffffff30;color:#fff"><button class="copy" id="joinRoom">참여</button></div><small id="roomStatus" style="display:block;margin-top:7px">새 방을 만들었어요.</small></div>
        <button class="primary" id="newGame">새 판 시작하기</button>
        <button class="secondary" id="undo">마지막 수 무르기</button>
        <div class="history"><div class="history-head"><h3>수순 기록</h3><span id="moveCount">0수</span></div><div class="history-list" id="historyList"><span class="move">아직 돌을 놓지 않았어요</span></div></div>
      </aside>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const SIZE = 15;
    const boardEl = document.getElementById('board');
    const turnText = document.getElementById('turnText');
    const turnDot = document.getElementById('turnDot');
    const statusText = document.getElementById('statusText');
    const historyList = document.getElementById('historyList');
    const moveCount = document.getElementById('moveCount');
    const roomCodeEl = document.getElementById('roomCode');
    let cells = [], moves = [], turn = 'black', finished = false, myColor = null, roomCode = '', channel = null;
    let scores = { black: Number(localStorage.getItem('omok-black-score') || 0), white: Number(localStorage.getItem('omok-white-score') || 0) };
    const names = () => ({ black: document.getElementById('blackName').value.trim() || '검은돌', white: document.getElementById('whiteName').value.trim() || '흰돌' });
    function makeRoom() { const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let code='OMOK-'; for(let i=0;i<4;i++) code+=chars[Math.floor(Math.random()*chars.length)]; roomCodeEl.textContent=code; }
    function buildBoard() { boardEl.innerHTML=''; cells=[]; for(let r=0;r<SIZE;r++){ cells[r]=[]; for(let c=0;c<SIZE;c++){ const btn=document.createElement('button'); btn.className='cell'; btn.type='button'; btn.style.left=`${c*100/(SIZE-1)}%`; btn.style.top=`${r*100/(SIZE-1)}%`; btn.setAttribute('role','gridcell'); btn.setAttribute('aria-label',`${r+1}행 ${c+1}열`); btn.dataset.r=r; btn.dataset.c=c; btn.addEventListener('click',()=>place(r,c)); boardEl.appendChild(btn); cells[r][c]=null; } } }
    function getStone(r,c){ return cells[r]?.[c]; }
    function place(r,c) { if(finished || cells[r][c]) return; const n=names(); const stone=document.createElement('span'); stone.className=`stone ${turn}`; cells[r][c]=turn; document.querySelector(`[data-r="${r}"][data-c="${c}"]`).appendChild(stone); moves.push({r,c,color:turn,stone}); render(); const line=winningLine(r,c,turn); if(line){ finished=true; line.forEach(([rr,cc])=>{ const s=document.querySelector(`[data-r="${rr}"][data-c="${cc}"] .stone`); if(s) s.classList.add('win'); }); scores[turn]++; localStorage.setItem(`omok-${turn}-score`,scores[turn]); document.getElementById(`${turn}Score`).textContent=scores[turn]; statusText.textContent=`${n[turn]}님이 다섯 수를 완성했어요.`; turnText.textContent='승부가 끝났습니다'; showToast(`${n[turn]} 승리!`); return; } if(moves.length===SIZE*SIZE){ finished=true; turnText.textContent='무승부'; statusText.textContent='판이 가득 찼어요.'; return; } turn=turn==='black'?'white':'black'; render(); }
    function winningLine(r,c,color){ const dirs=[[1,0],[0,1],[1,1],[1,-1]]; for(const [dr,dc] of dirs){ let line=[[r,c]]; for(const s of [1,-1]){ let rr=r+dr*s,cc=c+dc*s; while(getStone(rr,cc)===color){ line.push([rr,cc]); rr+=dr*s; cc+=dc*s; } } if(line.length>=5) return line; } return null; }
    function render(){ const n=names(); document.getElementById('blackLabel').textContent=n.black; document.getElementById('whiteLabel').textContent=n.white; document.getElementById('playerBlack').classList.toggle('active',turn==='black'&&!finished); document.getElementById('playerWhite').classList.toggle('active',turn==='white'&&!finished); turnDot.classList.toggle('white',turn==='white'&&!finished); if(!finished) turnText.textContent=`${turn==='black'?n.black:n.white} 차례`; moveCount.textContent=`${moves.length}수`; historyList.innerHTML=moves.length?moves.map((m,i)=>`<span class="move">${i+1}. ${m.color==='black'?'●':'○'} ${m.r+1},${m.c+1}</span>`).join(''):'<span class="move">아직 돌을 놓지 않았어요</span>'; }
    function reset(){ cells.forEach(row=>row.forEach(cell=>{ if(cell) cell=null; })); moves=[]; turn='black'; finished=false; buildBoard(); makeRoom(); statusText.textContent='가로, 세로, 대각선으로 다섯 개를 먼저 이어 보세요.'; render(); }
    function undo(){ if(!moves.length||finished) return; const last=moves.pop(); cells[last.r][last.c]=null; last.stone.remove(); turn=last.color; render(); showToast('마지막 수를 무르었습니다.'); }
    function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }
    document.getElementById('newGame').onclick=reset; document.getElementById('newGameTop').onclick=reset; document.getElementById('undo').onclick=undo;
    document.getElementById('copyCode').onclick=async()=>{ try { await navigator.clipboard.writeText(`오목 방 코드 ${roomCodeEl.textContent}`); showToast('초대 코드를 복사했어요.'); } catch { showToast(`방 코드: ${roomCodeEl.textContent}`); } };
    ['blackName','whiteName'].forEach(id=>document.getElementById(id).addEventListener('input',render));
    buildBoard(); makeRoom(); document.getElementById('blackScore').textContent=scores.black; document.getElementById('whiteScore').textContent=scores.white; render();
    function sync(){ if(channel) channel.postMessage({type:'state',cells,turn,finished,moves:moves.map(m=>({r:m.r,c:m.c,color:m.color}))}); }
    function openRoom(){ roomCode=roomCodeEl.textContent; myColor='black'; if(channel) channel.close(); channel=new BroadcastChannel('stone-wind-omok-'+roomCode); channel.onmessage=e=>{ if(e.data.type==='hello') sync(); if(e.data.type==='state'&&myColor==='white') applyRemote(e.data); }; document.getElementById('roomStatus').textContent=`방 ${roomCode} 생성됨 · 흑돌로 참여 중`; sync(); }
    function applyRemote(data){ cells=data.cells; turn=data.turn; finished=data.finished; buildBoard(); for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(cells[r][c]){ const stone=document.createElement('span'); stone.className=`stone ${cells[r][c]}`; document.querySelector(`[data-r="${r}"][data-c="${c}"]`).appendChild(stone); } moves=(data.moves||[]).map(m=>({...m,stone:document.querySelector(`[data-r="${m.r}"][data-c="${m.c}"] .stone`)})); render(); }
    function joinRoom(){ const code=document.getElementById('roomInput').value.trim().toUpperCase(); if(!code){showToast('초대 코드를 입력하세요.');return} roomCode=code; myColor='white'; if(channel) channel.close(); channel=new BroadcastChannel('stone-wind-omok-'+roomCode); channel.onmessage=e=>{if(e.data.type==='state')applyRemote(e.data)}; channel.postMessage({type:'hello'}); document.getElementById('roomStatus').textContent=`방 ${roomCode} 참여 중 · 흰돌`; showToast('친구의 오목판에 연결했습니다.'); }
    function applyRemote(data){ const incoming=data.cells; turn=data.turn; finished=data.finished; buildBoard(); cells=incoming; for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(cells[r][c]){const stone=document.createElement('span');stone.className=`stone ${cells[r][c]}`;document.querySelector(`[data-r="${r}"][data-c="${c}"]`).appendChild(stone)} moves=(data.moves||[]).map(m=>({...m,stone:document.querySelector(`[data-r="${m.r}"][data-c="${m.c}"] .stone`)})); render(); }
    const localPlace=place; place=(r,c)=>{if(myColor&&myColor!==turn)return;localPlace(r,c);sync()}; const localUndo=undo; undo=()=>{if(myColor==='white')return;localUndo();sync()}; document.getElementById('joinRoom').onclick=joinRoom; document.getElementById('roomInput').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom()}); openRoom(); setInterval(sync,500);
  </script>
</body>
</html>
<script>myColor=null;</script>
