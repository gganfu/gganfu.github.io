<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>깐퓨 게임 놀이터</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 0 50px;
      background: #eef2f5;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin: 10px 0 30px;
    }

    .game {
      display: block;
      width: 90%;
      max-width: 560px;
      margin: 22px auto;
      padding-bottom: 20px;
      overflow: hidden;
      border-radius: 22px;
      background: white;
      color: #222;
      text-decoration: none;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 5px 15px #999;
    }

    .game:active {
      transform: scale(0.98);
    }

    .game img {
      display: block;
      width: 100%;
      height: 360px;
      object-fit: contain;
      background: #182438;
    }

    .game span {
      display: block;
      margin-top: 8px;
      color: #667;
      font-size: 13px;
      font-weight: normal;
    }

    @media (max-width: 520px) {
      .game img {
        height: 300px;
      }
    }
  </style>
</head>

<body>
  <h1>🎮 깐퓨 게임 놀이터</h1>

  <a class="game" href="dragon.html">
    <img src="dragon-pc.png" alt="드래곤 컴퓨터용">
    드래곤 게임 컴퓨터용
    <span>컴퓨터에서 플레이하기</span>
  </a>

  <a class="game" href="dragon-mobile.html">
    <img src="dragon-mobile.png" alt="드래곤 모바일용">
    드래곤 게임 모바일용
    <span>휴대폰에서 플레이하기</span>
  </a>

  <a class="game" href="boardgames.html">
    <img src="boardgames.png" alt="보드게임">
    보드게임
    <span>오목 · 체스 · 장기 · 바둑</span>
  </a>

  <a class="game" href="alfakgi.html">
    <img src="alkagi.png" alt="알까기 챔피언스">
    알까기 챔피언스
    <span>알을 튕겨 상대 알을 밀어내기</span>
  </a>
</body>
</html>
