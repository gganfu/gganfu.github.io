  <div class="top"><header><div class="eyebrow">GGANFU GAME PLAYGROUND</div><h1>게임 놀이터</h1><p class="subtitle">하고 싶은 게임을 골라서 플레이해봐!</p></header></div>

      <article class="card"><div class="thumb" style="--a:#5c2c71;--b:#d89b55"><span>🎲</span></div><div class="info"><h3>보드게임 모음</h3><p>오목, 체스, 장기, 바둑을 골라서 플레이</p><a class="play" href="boardgames.html">게임 고르기</a></div></article>
