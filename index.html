<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>깐퓨 게임 놀이터</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px 50px;
      background: linear-gradient(145deg, #fff6d9, #e9f2ef);
      font-family: system-ui, sans-serif;
      color: #17212b;
      text-align: center;
    }

    .wrap {
      width: min(560px, 100%);
      margin: auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 48px);
    }

    header p {
      color: #71808d;
      margin: 8px 0 24px;
    }

    .card {
      display: block;
      margin: 15px auto;
      padding: 0 0 18px;
      border: 1px solid #eadfc9;
      border-radius: 20px;
      background: #fffaf0;
      color: #17212b;
      text-decoration: none;
      box-shadow: 0 10px 24px #53625b22;
      overflow: hidden;
    }

    .card img {
      display: block;
      width: 100%;
      height: 205px;
      object-fit: contain;
      margin-bottom: 12px;
      background: #182438;
    }

    .card h2 {
      margin: 0 12px 4px;
      font-size: 22px;
    }

    .card p {
      margin: 0;
      color: #71808d;
      font-size: 13px;
    }

    .download {
      padding: 20px 18px;
      background: #edf5ff;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 8px;
    }

    footer {
      margin-top: 24px;
      color: #8a969e;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <p>GGANFU GAME PLAYGROUND</p>
      <h1>🎮 깐퓨 게임 놀이터</h1>
      <p>친구와 함께 즐기는 깐퓨의 게임 모음</p>
    </header>

    <a class="card" href="dragon.html">
      <img src="dragon-pc.png" alt="드래곤 게임 컴퓨터용">
      <h2>드래곤 게임 컴퓨터용</h2>
      <p>컴퓨터에서 플레이하기</p>
    </a>

    <a class="card" href="dragon-mobile.html">
      <img src="dragon-mobile.png" alt="드래곤 게임 모바일용">
      <h2>드래곤 게임 모바일용</h2>
      <p>휴대폰에서 플레이하기</p>
    </a>

    <a class="card" href="boardgames.html">
      <img src="boardgames.png" alt="보드게임">
      <h2>보드게임</h2>
      <p>오목 · 체스 · 장기 · 바둑</p>
    </a>

    <a class="card" href="alfakgi.html">
      <div class="icon">🥚</div>
      <h2>알까기 챔피언스</h2>
      <p>친구와 즐기는 2인 로컬 대전</p>
    </a>

    <a class="card download" href="Alkagi-Champions-Offline.exe" download>
      <div class="icon">⬇️</div>
      <h2>오프라인 실행파일</h2>
      <p>인터넷 없이 Windows에서 플레이하기</p>
    </a>

    <footer>
      Made for friends · 2 Player Local Battle
    </footer>
  </main>
</body>
</html>
