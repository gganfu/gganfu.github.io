<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>깐퓨 게임 놀이터</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      background: #eef3e9;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      color: #193b58;
      margin-bottom: 30px;
    }

    .game-list {
      max-width: 650px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .game {
      display: block;
      background: white;
      border-radius: 22px;
      overflow: hidden;
      text-decoration: none;
      color: #222;
      box-shadow: 0 5px 15px #0002;
    }

    .game img {
      width: 100%;
      height: 260px;
      object-fit: contain;
      background: #17263b;
      display: block;
    }

    .game h2 {
      margin: 16px 10px 5px;
    }

    .game p {
      margin: 0 10px 20px;
      color: #718096;
    }
  </style>
</head>

<body>

  <h1>🎮 깐퓨 게임 놀이터</h1>

  <div class="game-list">

    <a class="game" href="dragon.html">
      <img src="dragon-pc.png" alt="드래곤 컴퓨터용">
      <h2>드래곤 게임</h2>
      <p>컴퓨터용</p>
    </a>

    <a class="game" href="dragon-mobile.html">
      <img src="dragon-mobile.png" alt="드래곤 모바일용">
      <h2>드래곤 게임</h2>
      <p>모바일용</p>
    </a>

    <a class="game" href="boardgames.html">
      <img src="boardgames.png" alt="보드게임">
      <h2>보드게임</h2>
      <p>오목 · 체스 · 장기 · 바둑</p>
    </a>

    <a class="game" href="alfakgi.html">
      <img src="alkagi.png" alt="알까기 챔피언스">
      <h2>알까기 챔피언스</h2>
      <p>친구와 즐기는 2인 게임</p>
    </a>

    <a class="game" href="gganfu-avengers.html">
      <img src="gganfu-avengers.png" alt="최신 깐퓨벤져스">
      <h2>최신 깐퓨벤져스</h2>
      <p>바로 플레이하기</p>
    </a>

  </div>

</body>
</html>
