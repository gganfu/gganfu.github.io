<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>깐퓨 게임 놀이터</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 0 50px;
      background: #eef2f5;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin: 10px 0 30px;
      color: #17202a;
    }

    .game {
      display: block;
      width: 90%;
      max-width: 520px;
      margin: 20px auto;
      padding: 28px 10px;
      border-radius: 22px;
      background: white;
      color: #17202a;
      text-decoration: none;
      font-size: 23px;
      font-weight: bold;
      box-shadow: 0 5px 15px #999;
    }

    .game:active {
      transform: scale(0.97);
    }

    .icon {
      display: block;
      margin-bottom: 12px;
      font-size: 65px;
    }

    .computer {
      background: #ffffff;
    }

    .mobile {
      background: #dff5ff;
    }

    .board {
      background: #ffe7b5;
    }

    .small {
      display: block;
      margin-top: 8px;
      color: #667;
      font-size: 13px;
      font-weight: normal;
    }
  </style>
</head>

<body>
  <h1>🎮 깐퓨 게임 놀이터</h1>

  <a class="game computer" href="dragon.html">
    <span class="icon">🐉</span>
    드래곤 게임 컴퓨터용
    <span class="small">컴퓨터에서 플레이하기</span>
  </a>

  <a class="game mobile" href="dragon-mobile.html">
    <span class="icon">📱</span>
    드래곤 게임 모바일용
    <span class="small">휴대폰에서 플레이하기</span>
  </a>

  <a class="game board" href="boardgames.html">
    <span class="icon">🎲</span>
    보드게임
    <span class="small">오목 · 체스 · 장기 · 바둑</span>
  </a>
</body>
</html>
