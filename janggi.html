<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>돌과 바람 · 장기</title><style>body{margin:0;background:#efe2cc;color:#10202b;font-family:system-ui,sans-serif}.shell{max-width:1050px;margin:auto;padding:25px 18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}.brand{display:flex;gap:12px;align-items:center}.mark{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:#10202b;color:#d89b55;font-size:24px}.eyebrow{color:#d89b55;font-size:11px;font-weight:900;letter-spacing:.16em}h1,h2{margin:0}h1{font-size:21px}.links{display:flex;gap:7px;flex-wrap:wrap}.link,.btn{padding:10px 13px;border:1px solid #10202b20;border-radius:11px;background:#ffffffaa;color:#10202b;font-weight:800;text-decoration:none;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.card,.panel{background:#fffaf1d4;border:1px solid #fff;box-shadow:0 20px 55px #10202b20;border-radius:25px}.card{padding:20px}.status{display:flex;justify-content:space-between;margin-bottom:15px;font-weight:900}.hint{color:#71808a;font-size:13px}.board-wrap{padding:11px;background:#b87943;border-radius:18px}.board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(10,1fr);aspect-ratio:9/10;border:3px solid #5e3825;background:#d9a669}.sq{border:1px solid #6d432c55;background:transparent;display:grid;place-items:center;min-width:0;min-height:0;font-size:clamp(22px,5vw,48px);font-family:serif}.sq.sel{background:#f2c15eaa}.red{color:#ae352b;text-shadow:0 1px #fff}.blue{color:#173f62;text-shadow:0 1px #fff}.panel{padding:20px;display:flex;flex-direction:column;gap:15px}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{padding:11px;border:1px solid #10202b1c;border-radius:14px}.player.active{border-color:#d89b55;box-shadow:0 0 0 3px #d89b5528}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:5px;vertical-align:-1px}.primary{background:#d89b55;border:0;width:100%}.muted{font-size:13px;color:#71808a}.captured{padding-top:14px;border-top:1px solid #10202b18;color:#71808a}.captured b{font-size:22px;color:#10202b}@media(max-width:720px){.layout{grid-template-columns:1fr}.panel{order:2}.links .link{padding:8px;font-size:12px}}</style></head><body><main class="shell"><header class="head"><div class="brand"><div class="mark">將</div><div><div class="eyebrow">STONE & WIND</div><h1>친구와 두는 장기</h1></div></div><nav class="links"><a class="link" href="omok.html">오목</a><a class="link" href="chess.html">체스</a><a class="link" href="baduk.html">바둑</a></nav></header><section class="layout"><section class="card"><div class="status"><span id="turn">초 차례</span><span class="hint">말을 선택한 뒤 이동할 칸을 누르세요.</span></div><div class="board-wrap"><div id="board" class="board"></div></div></section><aside class="panel"><div><div class="eyebrow">MATCH ROOM</div><h2>장기판</h2></div><div class="players"><div id="redPlayer" class="player active"><span class="dot red"></span>초</div><div id="bluePlayer" class="player"><span class="dot blue"></span>한</div></div><button id="new" class="btn primary">새 판 시작하기</button><button id="undo" class="btn">마지막 수 무르기</button><div class="captured">잡은 말 <b id="score">0 : 0</b></div><p class="muted">초가 먼저 시작합니다. 주요 말 이동과 잡기를 지원합니다.</p></aside></section></main><script>
const I={rK:'帥',rG:'仕',rR:'車',rH:'馬',rE:'象',rC:'包',rS:'卒',bK:'將',bG:'士',bR:'車',bH:'馬',bE:'象',bC:'包',bS:'卒'};let b,t='r',sel=null,hist=[],cap=[0,0];const B=document.getElementById('board');function start(){b=Array.from({length:10},()=>Array(9).fill(null));b[0]=['bR','bH','bE','bG','bK','bG','bE','bH','bR'];b[2][1]=b[2][7]='bC';b[3][0]=b[3][2]=b[3][4]=b[3][6]=b[3][8]='bS';b[6][0]=b[6][2]=b[6][4]=b[6][6]=b[6][8]='rS';b[7][1]=b[7][7]='rC';b[9]=['rR','rH','rE','rG','rK','rG','rE','rH','rR'];t='r';sel=null;hist=[];cap=[0,0];draw()}function draw(){B.innerHTML='';for(let r=0;r<10;r++)for(let c=0;c<9;c++){let q=document.createElement('button');q.className='sq'+(sel&&sel.r===r&&sel.c===c?' sel':'');q.dataset.r=r;q.dataset.c=c;q.innerHTML=b[r][c]?`<span class="${b[r][c][0]==='r'?'red':'blue'}">${I[b[r][c]]}</span>`:'';q.onclick=()=>tap(r,c);B.appendChild(q)}document.getElementById('turn').textContent=t==='r'?'초 차례':'한 차례';document.getElementById('redPlayer').classList.toggle('active',t==='r');document.getElementById('bluePlayer').classList.toggle('active',t==='b');document.getElementById('score').textContent=`${cap[0]} : ${cap[1]}`}function legal(r,c){let p=b[r][c],o=[];if(!p||p[0]!==t)return o;let add=(x,y)=>{if(x>=0&&x<10&&y>=0&&y<9&&(!b[x][y]||b[x][y][0]!==p[0]))o.push({r:x,c:y})};if(p[1]==='S'){let d=p[0]==='r'?-1:1;add(r+d,c);add(r,c-1);add(r,c+1)}else if(p[1]==='H'){for(let[x,y,br,bc]of[[2,1,1,0],[2,-1,1,0],[-2,1,-1,0],[-2,-1,-1,0],[1,2,0,1],[1,-2,0,-1],[-1,2,0,1],[-1,-2,0,-1]])if(!b[r+br]?.[c+bc])add(r+x,c+y)}else if(p[1]==='R'||p[1]==='C'){for(let[x,y]of[[1,0],[-1,0],[0,1],[0,-1]]){let rr=r+x,cc=c+y;while(rr>=0&&rr<10&&cc>=0&&cc<9){if(b[rr][cc]){if(b[rr][cc][0]!==p[0])o.push({r:rr,c:cc});break}if(p[1]==='R')o.push({r:rr,c:cc});rr+=x;cc+=y}}}else{for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)if(x||y)add(r+x,c+y)}return o}function tap(r,c){if(sel){if(legal(sel.r,sel.c).some(x=>x.r===r&&x.c===c)){let old=b[sel.r][sel.c],take=b[r][c];hist.push({from:sel,to:{r,c},old,take});b[r][c]=old;b[sel.r][sel.c]=null;if(take)cap[take[0]==='r'?0:1]++;t=t==='r'?'b':'r';sel=null;draw();return}sel=null}if(b[r][c]&&b[r][c][0]===t)sel={r,c};draw()}document.getElementById('new').onclick=start;document.getElementById('undo').onclick=()=>{let m=hist.pop();if(!m)return;b[m.from.r][m.from.c]=m.old;b[m.to.r][m.to.c]=m.take||null;if(m.take)cap[m.take[0]==='r'?0:1]--;t=m.old[0];sel=null;draw()};start();</script></body></html>

<style>.roombox{border-top:1px solid #10202b18;padding-top:14px}.roomrow{display:flex;gap:7px}.roomrow input{min-width:0;width:100%;padding:10px;border:1px solid #10202b20;border-radius:10px;text-transform:uppercase;font-weight:800}.roomrow button{padding:0 11px;border:0;border-radius:10px;background:#10202b;color:#fff;font-weight:800}.roomstatus{font-size:12px;color:#71808a;margin-top:7px}</style>
<script>
document.querySelector('.panel').insertAdjacentHTML('afterbegin','<div class="roombox"><div class="eyebrow">초대코드</div><div class="roomrow"><input id="roomInput" placeholder="코드 입력"><button id="joinRoom">참여</button></div><div class="roomstatus" id="roomStatus"></div></div>');let myColor=null,roomCode='',channel=null;function sync(){if(channel)channel.postMessage({type:'state',b,t,cap})}function applyRemote(d){b=d.b;t=d.t;cap=d.cap;sel=null;draw()}function createRoom(){roomCode=Math.random().toString(36).slice(2,6).toUpperCase();myColor='r';if(channel)channel.close();channel=new BroadcastChannel('stone-wind-janggi-'+roomCode);channel.onmessage=e=>{if(e.data.type==='hello')sync();if(e.data.type==='state'&&myColor==='b')applyRemote(e.data)};document.getElementById('roomInput').value=roomCode;document.getElementById('roomStatus').textContent='방 '+roomCode+' 생성됨 · 초';sync()}function joinRoom(){roomCode=document.getElementById('roomInput').value.trim().toUpperCase();if(!roomCode)return;myColor='b';if(channel)channel.close();channel=new BroadcastChannel('stone-wind-janggi-'+roomCode);channel.onmessage=e=>{if(e.data.type==='state')applyRemote(e.data)};channel.postMessage({type:'hello'});document.getElementById('roomStatus').textContent='방 '+roomCode+' 참여 중 · 한'}const oldTap=tap;tap=(r,c)=>{if(myColor&&myColor!==t)return;oldTap(r,c);sync()};document.getElementById('joinRoom').onclick=joinRoom;createRoom();setInterval(sync,500);
</script>
