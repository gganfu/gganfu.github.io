<script>(function (root) {
  'use strict';
  // A local conversation engine. Each follow-up belongs to the question that asked it.
  function createConversation() {
    const memory = { name: '', favorite: '', food: '', color: '', build: '', mood: '', wait: null, topic: '', lastReply: '', quiz: 0, story: 0, storyEnd: false };
    const counts = {};
    const choose = (key, choices) => choices[(counts[key] = (counts[key] || 0) + 1) % choices.length];
    const compact = text => text.replace(/\s/g, '');
    const tidy = text => text.replace(/[.!?。？！~]+$/g, '').trim();
    const colors = /노란색|노랑|노랗|파란색|파랑|파랗|빨간색|빨강|빨갛|초록색|초록|녹색|분홍색|분홍|핑크|보라색|보라|검정색|검정|검은색|검은|하얀색|하양|흰색|흰|주황색|주황|갈색|무지개/;
    const foods = /떡볶이|아이스크림|햄버거|초콜릿|초코|스파게티|파스타|바나나|피자|치킨|라면|김밥|과자|사과|수박|딸기|빵|밥|고기|짜장면|짬뽕|카레|만두|감자|계란|달걀|우유|주스/;
    const positive = /^(응|웅|네|넵|어|그래|맞아|ㅇㅇ|오케이|좋아|좋지|해줘|할래|할래요|해보자|예)[.!?~ㅋㅎ]*$/;
    const negative = /^(아니|아니야|아니요|싫어|안할래|안해|별로|ㄴㄴ|됐어)[.!?~ㅋㅎ]*$/;
    const quizzes = [
      { question: '크리퍼는 가까이 오면 뭘 할까?', words: ['폭발', '터져', '터진', '펑'], answer: '펑 하고 폭발해!', hint: '펑! 하는 거야.' },
      { question: '바나나는 무슨 색일까?', words: ['노랑', '노란', '노랗', 'yellow'], answer: '노란색! 나랑 같은 색이지.', hint: '내 몸이랑 같은 색이야.' },
      { question: '마크에서 나무를 캐면 뭐가 나올까?', words: ['원목', '목재', '나무'], answer: '원목이 나와. 판자로도 만들 수 있어!', hint: '판자로 만들 수 있는 재료야.' }

    function wait(kind, text, data = {}) { memory.wait = { kind, ...data }; return text; }

    function story() {
      const index = memory.story++ % 3; memory.topic = 'story'; memory.storyEnd = false;
      return wait('story', [
        '동굴에서 문을 하나 찾았어. 좋은 말을 해야 열린대! 뭐라고 해 볼까?',
        '하늘에 떠 있는 섬을 찾았어! 다리를 만들까, 날개를 찾아볼까?',
        '크리퍼가 폭발 대신 꽃을 선물하고 싶대. 같이 꽃밭을 만들자! 무슨 색 꽃이 좋을까?'
      ][index], { index });
    }
    function topicOf(c) {
      if (/마크|마인크래프트|크리퍼|다이아|블록|곡괭이|네더|엔더|좀비|스켈레톤/.test(c)) return 'minecraft';

      if (/강아지|고양이|토끼|햄스터|동물/.test(c)) return 'animal';
