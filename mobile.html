<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10202b">
  <title>보드게임 모바일</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(145deg,#10202b,#3d2d2a);color:#fff;font-family:system-ui,sans-serif}
    main{width:min(100%,560px);margin:auto;padding:30px 18px 40px;text-align:center}
    .mark{font-size:46px;margin-top:12px}
    h1{margin:8px 0;font-size:clamp(28px,8vw,44px)}
    p{color:#d7e0df;line-height:1.6}
    .mode{display:flex;gap:10px;margin:24px 0 4px}
    .mode button{flex:1;padding:14px 8px;border:2px solid #ffffff55;border-radius:14px;background:#ffffff12;color:#fff;font-size:16px;font-weight:900;cursor:pointer;touch-action:manipulation}
    .mode button.active{background:#f3d29b;color:#10202b;border-color:#f3d29b}
    .games{display:grid;gap:14px;margin-top:18px}
    a{display:flex;align-items:center;gap:15px;min-height:76px;padding:18px 20px;border-radius:20px;background:#fff;color:#10202b;text-decoration:none;font-size:22px;font-weight:900;box-shadow:0 8px 20px #0004;touch-action:manipulation}
    a:active{transform:scale(.97);background:#f3d29b}
    .icon{font-size:32px;width:42px}
    small{display:block;margin-top:28px;color:#b8c8c8;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="mark">🎮</div>
    <h1>보드게임</h1>
    <p>먼저 사용할 화면을 고른 다음 게임을 눌러봐!</p>
    <div class="mode" aria-label="화면 모드">
      <button class="active" data-mode="mobile">📱 모바일 모드</button>
      <button data-mode="computer">💻 컴퓨터 모드</button>
    </div>
    <div class="games">
      <a href="omok.html"><span class="icon">⚫</span>오목</a>
      <a href="chess.html"><span class="icon">♟</span>체스</a>
      <a href="janggi.html"><span class="icon">將</span>장기</a>
      <a href="baduk.html"><span class="icon">●</span>바둑</a>
    </div>
    <small id="modeText">모바일 모드: 큰 버튼과 작은 화면에 맞춰 열려.</small>
  </main>
  <script>
    const buttons=[...document.querySelectorAll('[data-mode]')], text=document.getElementById('modeText');
    buttons.forEach(button=>button.onclick=()=>{
      buttons.forEach(item=>item.classList.toggle('active',item===button));
      const mode=button.dataset.mode;
      text.textContent=mode==='mobile'?'모바일 모드: 큰 버튼과 작은 화면에 맞춰 열려.':'컴퓨터 모드: 큰 화면에서 보기 좋게 열려.';
      document.querySelectorAll('.games a').forEach(link=>link.href=link.href.split('?')[0]+'?mode='+mode);
    });
  </script>
</body>
</html>
