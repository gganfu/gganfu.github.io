<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>베리티와 이야기하기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#132a21;color:#f3ffe8;font-family:system-ui,'Malgun Gothic',sans-serif;min-height:100dvh}button,input{font:inherit}button{cursor:pointer}header{max-width:1100px;margin:auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0}a{color:#d9edc4;text-decoration:none}.sound{background:#294334;color:#fff;border:1px solid #769465;border-radius:12px;padding:10px 14px}main{max-width:1100px;margin:auto;padding:0 24px 24px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px}.stage{min-height:570px;background:linear-gradient(#99d4ed 0 58%,#72a83e 58% 65%,#4b742d 65%);border:3px solid #acc787;border-radius:24px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s,border-color .15s}.stage:after{content:'';position:absolute;bottom:0;height:35%;width:100%;background:repeating-conic-gradient(#ffffff06 0% 25%,#00000009 0% 50%) 0/48px 48px;pointer-events:none}.badge{position:absolute;top:20px;left:20px;background:#173927dc;border-radius:9px;padding:8px 12px;font-size:14px}.portrait{width:270px;height:270px;object-fit:contain;border-radius:22px;box-shadow:0 20px 40px #12280733;animation:bob 3s ease-in-out infinite;z-index:1}.scary{display:none;object-fit:contain;box-shadow:none;border-radius:0;width:300px;height:370px}.bubble{z-index:2;margin:25px 22px 0;padding:18px 22px;background:#fffdec;color:#243618;border-radius:18px;max-width:90%;text-align:center;line-height:1.6;font-size:20px;font-weight:700;min-height:70px;box-shadow:0 5px 0 #31512c33}.count{height:30px;z-index:2;margin:12px 0 0;font-size:16px;font-weight:700}.stage.transformed{background:#090706;border-color:#bd7643}.transformed .happy{display:none}.transformed .scary{display:block;animation:none}.transformed .bubble{background:#ffe3b1;color:#652d10}.chat{background:#f5f8ec;color:#203728;border-radius:24px;padding:22px;display:flex;flex-direction:column;min-height:570px}h2{margin:0;font-size:22px}.hint{font-size:14px;color:#5a715e;margin:8px 0 16px;line-height:1.6}.messages{height:340px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:10px 2px 18px;scroll-behavior:smooth}.message{max-width:90%;padding:12px 15px;border-radius:15px;background:#e0eacd;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}.message.user{align-self:flex-end;background:#2b573b;color:white}.message strong{display:block;font-size:12px;margin-bottom:4px;opacity:.7}.suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}.suggestions button{background:transparent;border:1px solid #afc19c;border-radius:20px;color:#345338;padding:7px 12px;font-size:14px}form{display:flex;gap:8px}input{width:100%;min-width:0;background:white;border:2px solid #bacda9;border-radius:12px;padding:12px;color:#203728}input:focus{outline:2px solid #548c43}button:focus-visible,a:focus-visible{outline:3px solid #e8b52c;outline-offset:3px}.send{background:#e9c83e;border:0;border-radius:12px;padding:12px 17px;font-weight:800;color:#26351d}.mic{width:100%;margin-top:10px;background:#e5eddc;border:1px solid #b3c49f;border-radius:12px;padding:10px;color:#304e33}.mic:disabled{opacity:.6;cursor:default}.status{min-height:22px;font-size:13px;color:#5a715e;margin:9px 0 0}.talking .portrait{animation:talk .3s ease-in-out infinite alternate}@keyframes bob{50%{transform:translateY(-12px)}}@keyframes talk{to{transform:translateY(-7px) scale(1.025)}}@media(max-width:750px){header{padding:16px}h1{font-size:20px}main{grid-template-columns:1fr;padding:0 12px 16px;gap:12px}.stage{min-height:360px}.portrait{width:190px;height:190px}.scary{width:210px;height:245px}.bubble{font-size:17px;margin-top:15px;padding:12px 16px}.badge{top:12px;left:12px}.chat{min-height:440px;padding:18px}.messages{height:220px}.sound{font-size:14px;padding:9px}}@media(prefers-reduced-motion:reduce){.portrait,.talking .portrait{animation:none}.messages{scroll-behavior:auto}}
.chat{min-width:0;align-self:start}
.messages{flex:0 0 340px;min-height:0;max-height:340px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;scroll-behavior:auto;scrollbar-color:#829e72 #e7eedb}
.message{flex-shrink:0}
.messages:focus-visible{outline:2px solid #548c43;outline-offset:3px}
@media(max-width:750px){.messages{flex-basis:220px;max-height:220px}}
</style>
</head>
<body>
<header><div><a href="index.html">‹ 게임 놀이터</a><h1>베리티와 이야기하기</h1></div><button class="sound" id="sound" aria-pressed="true">🔊 목소리 켜짐</button></header>
<main>
<section class="stage" id="stage" aria-label="베리티"><span class="badge" id="mood">웃는 베리티</span><span id="bad-count" role="status" style="position:absolute;top:20px;right:20px;border-radius:9px;padding:8px 12px;background:#fffdec;color:#652d10;font-size:14px;font-weight:800;z-index:3">나쁜 말 횟수: 0</span><img class="portrait happy" src="verity-happy.png" alt="활짝 웃는 노란 베리티"><img class="portrait scary" src="verity-scary.png" alt="무서운 모습으로 변한 베리티"><div class="bubble" id="bubble">안녕! 나는 베리티야. 같이 이야기하자!</div><p class="count" id="count"></p></section>
<section class="chat"><h2>오늘은 무슨 얘기 할까?</h2><p class="hint">글로 쓰거나 마이크로 말해 줘. 서로 예쁜 말을 써 보자!</p><div class="messages" id="messages" tabindex="0" role="log" aria-live="polite" aria-label="대화 내용"></div><div class="suggestions"><button type="button" data-text="안녕!">안녕!</button><button type="button" data-text="마인크래프트 좋아해?">마인크래프트</button><button type="button" data-text="재미있는 이야기 해줘">재미있는 이야기</button></div><form id="form"><input id="input" aria-label="베리티에게 할 말" placeholder="베리티에게 말해 줘…" maxlength="300" autocomplete="off"><button class="send" type="submit">보내기</button></form><button class="mic" id="mic" type="button">🎤 마이크로 말하기</button><p class="status" id="status"></p></section>
</main>
<script src="verity-dialogue.js"></script>
<script src="verity.js"></script>
</body></html>
