<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>돌과 바람 · 바둑</title><style>body{margin:0;background:#efe2cc;color:#10202b;font-family:system-ui,sans-serif}.shell{max-width:1050px;margin:auto;padding:25px 18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}.brand{display:flex;gap:12px;align-items:center}.mark{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:#10202b;color:#d89b55;font-size:24px}.eyebrow{color:#d89b55;font-size:11px;letter-spacing:.16em;font-weight:900}h1,h2{margin:0}h1{font-size:21px}.links{display:flex;gap:7px;flex-wrap:wrap}.link,.btn{padding:10px 13px;border:1px solid #10202b20;border-radius:11px;background:#ffffffaa;color:#10202b;font-weight:800;text-decoration:none;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.card,.panel{background:#fffaf1d4;border:1px solid #fff;box-shadow:0 20px 55px #10202b20;border-radius:25px}.card{padding:20px}.status{display:flex;justify-content:space-between;margin-bottom:15px;font-weight:900}.hint{font-size:13px;color:#71808a}.wrap{padding:11px;background:#b87943;border-radius:18px}.board{width:min(100%,690px);margin:auto;aspect-ratio:1;display:grid;grid-template-columns:repeat(19,1fr);grid-template-rows:repeat(19,1fr);padding:2.4%;background:#d9a568;border:3px solid #603b27}.pt{border:0;background:transparent;position:relative;min-width:0;min-height:0}.stone{position:absolute;width:88%;height:88%;left:6%;top:6%;border-radius:50%;box-shadow:2px 3px 4px #4b2f1c66}.black{background:#162329}.white{background:#fffaf0;border:1px solid #bcb2a4}.pt.last{outline:2px solid #d89b55;outline-offset:-3px;border-radius:50%}.panel{padding:20px;display:flex;flex-direction:column;gap:15px}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{padding:11px;border:1px solid #10202b1c;border-radius:14px}.player.active{border-color:#d89b55;box-shadow:0 0 0 3px #d89b5528}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-1px;margin-right:5px}.primary{background:#d89b55;border:0;width:100%}.muted{font-size:13px;color:#71808a}.stats{border-top:1px solid #10202b18;padding-top:15px;color:#71808a}.stats b{font-size:22px;color:#10202b}@media(max-width:720px){.layout{grid-template-columns:1fr}.panel{order:2}.links .link{padding:8px;font-size:12px}}</style></head><body><main class="shell"><header class="head"><div class="brand"><div class="mark">●</div><div><div class="eyebrow">STONE & WIND</div><h1>친구와 두는 바둑</h1></div></div><nav class="links"><a class="link" href="omok.html">오목</a><a class="link" href="chess.html">체스</a><a class="link" href="janggi.html">장기</a></nav></header><section class="layout"><section class="card"><div class="status"><span id="turn">흑돌 차례</span><span class="hint">교차점에 돌을 놓으세요.</span></div><div class="wrap"><div id="board" class="board"></div></div></section><aside class="panel"><div><div class="eyebrow">MATCH ROOM</div><h2>바둑판</h2></div><div class="players"><div id="blackPlayer" class="player active"><span class="dot black"></span>흑돌</div><div id="whitePlayer" class="player"><span class="dot white"></span>백돌</div></div><button class="btn primary" id="new">새 판 시작하기</button><button class="btn" id="pass">패스</button><button class="btn" id="undo">마지막 수 무르기</button><div class="stats">잡은 돌<br><b id="score">흑 0 · 백 0</b></div><p class="muted">돌을 둘 곳이 없으면 패스하세요. 같은 화면에서 번갈아 둘 수 있습니다.</p></aside></section></main><script>
const N=19;let a=[],turn='black',hist=[],caps={black:0,white:0},last=null;const board=document.getElementById('board');function start(){a=Array.from({length:N},()=>Array(N).fill(null));turn='black';hist=[];caps={black:0,white:0};last=null;draw()}function draw(){board.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=document.createElement('button');p.className='pt'+(last&&last.r===r&&last.c===c?' last':'');p.dataset.r=r;p.dataset.c=c;if(a[r][c]){const s=document.createElement('span');s.className='stone '+a[r][c];p.appendChild(s)}p.onclick=()=>put(r,c);board.appendChild(p)}document.getElementById('turn').textContent=turn==='black'?'흑돌 차례':'백돌 차례';document.getElementById('blackPlayer').classList.toggle('active',turn==='black');document.getElementById('whitePlayer').classList.toggle('active',turn==='white');document.getElementById('score').textContent=`흑 ${caps.black} · 백 ${caps.white}`}function group(r,c){const color=a[r][c],seen=new Set(),stones=[],stack=[[r,c]];while(stack.length){const[x,y]=stack.pop(),key=x+','+y;if(seen.has(key)||x<0||x>=N||y<0||y>=N||a[x][y]!==color)continue;seen.add(key);stones.push([x,y]);stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1])}let libs=new Set();for(const[x,y]of stones)for(const[nr,nc]of[[x+1,y],[x-1,y],[x,y+1],[x,y-1]])if(nr>=0&&nr<N&&nc>=0&&nc<N&&!a[nr][nc])libs.add(nr+','+nc);return{stones,libs}}function put(r,c){if(a[r][c])return;const color=turn,other=turn==='black'?'white':'black';a[r][c]=color;let removed=[];for(const[nr,nc]of[[r+1,c],[r-1,c],[r,c+1],[r,c-1]])if(nr>=0&&nr<N&&nc>=0&&nc<N&&a[nr][nc]===other){const g=group(nr,nc);if(!g.libs.size){g.stones.forEach(([x,y])=>{a[x][y]=null;removed.push([x,y])});caps[color]+=g.stones.length}}const own=group(r,c);if(!own.libs.size&&!removed.length){a[r][c]=null;return}hist.push({r,c,color,removed});last={r,c};turn=other;draw()}document.getElementById('new').onclick=start;document.getElementById('pass').onclick=()=>{turn=turn==='black'?'white':'black';last=null;draw()};document.getElementById('undo').onclick=()=>{const m=hist.pop();if(!m)return;a[m.r][m.c]=null;m.removed.forEach(([r,c])=>a[r][c]=m.color==='black'?'white':'black');caps[m.color]-=m.removed.length;turn=m.color;last=null;draw()};start();</script></body></html>

<style>.roombox{border-top:1px solid #10202b18;padding-top:14px}.roomrow{display:flex;gap:7px}.roomrow input{min-width:0;width:100%;padding:10px;border:1px solid #10202b20;border-radius:10px;text-transform:uppercase;font-weight:800}.roomrow button{padding:0 11px;border:0;border-radius:10px;background:#10202b;color:#fff;font-weight:800}.roomstatus{font-size:12px;color:#71808a;margin-top:7px}</style>
<script>
document.querySelector('.panel').insertAdjacentHTML('afterbegin','<div class="roombox"><div class="eyebrow">초대코드</div><div class="roomrow"><input id="roomInput" placeholder="코드 입력"><button id="joinRoom">참여</button></div><div class="roomstatus" id="roomStatus"></div></div>');let myColor=null,roomCode='',channel=null;function sync(){if(channel)channel.postMessage({type:'state',a,turn,caps,last})}function applyRemote(d){a=d.a;turn=d.turn;caps=d.caps;last=d.last;draw()}function createRoom(){roomCode=Math.random().toString(36).slice(2,6).toUpperCase();myColor='black';if(channel)channel.close();channel=new BroadcastChannel('stone-wind-baduk-'+roomCode);channel.onmessage=e=>{if(e.data.type==='hello')sync();if(e.data.type==='state'&&myColor==='white')applyRemote(e.data)};document.getElementById('roomInput').value=roomCode;document.getElementById('roomStatus').textContent='방 '+roomCode+' 생성됨 · 흑돌';sync()}function joinRoom(){roomCode=document.getElementById('roomInput').value.trim().toUpperCase();if(!roomCode)return;myColor='white';if(channel)channel.close();channel=new BroadcastChannel('stone-wind-baduk-'+roomCode);channel.onmessage=e=>{if(e.data.type==='state')applyRemote(e.data)};channel.postMessage({type:'hello'});document.getElementById('roomStatus').textContent='방 '+roomCode+' 참여 중 · 백돌'}const oldPut=put;put=(r,c)=>{if(myColor&&myColor!==turn)return;oldPut(r,c);sync()};document.getElementById('joinRoom').onclick=joinRoom;createRoom();setInterval(sync,500);
</script>
</html>
